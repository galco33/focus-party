name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler et tester
        run: npm test
